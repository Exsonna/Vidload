<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VidLoad</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1>VidLoad</h1>
        <span id="tier-badge" hidden></span>
      </div>
      <p id="status">Scanning…</p>
    </header>

    <section id="paywall" hidden>
      <div class="paywall-icon">★</div>
      <h2>Free limit reached</h2>
      <p id="paywall-detail">You've used your free downloads for today.</p>
      <div class="upsell">
        <div class="upsell-price" id="paywall-price">$4.99</div>
        <div class="upsell-details">One-time payment · lifetime unlimited downloads</div>
      </div>
      <button id="upgrade-btn" type="button">Upgrade to Pro</button>
      <button id="paywall-back" type="button">Back to videos</button>
      <p id="paywall-foot"></p>
    </section>

    <ul id="list"></ul>
    <footer>
      <button id="toggle-hidden" type="button" hidden></button>
    </footer>
    <div id="row-menu" class="row-menu" hidden role="menu">
      <button class="menu-item" data-action="copy-url" type="button" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
        Copy URL
      </button>
      <button class="menu-item" data-action="open-tab" type="button" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
        Open URL in new tab
      </button>
      <button class="menu-item" data-action="save-as" type="button" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download as…
      </button>
      <div class="menu-divider"></div>
      <button class="menu-item danger" data-action="dismiss" type="button" role="menuitem">
        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        Dismiss
      </button>
    </div>
    <template id="row-template">
      <li class="row">
        <div class="thumb">
          <img class="thumb-img" referrerpolicy="no-referrer" alt="" />
          <svg class="thumb-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          <span class="thumb-quality"></span>
          <span class="thumb-duration"></span>
          <span class="thumb-kind"></span>
        </div>
        <div class="content">
          <div class="content-head">
            <span class="format-badge"></span>
            <select class="variant-picker" title="Quality" hidden></select>
            <span class="title" tabindex="0"></span>
            <button class="dismiss" type="button" title="Dismiss" aria-label="Dismiss">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
          <div class="content-foot">
            <button class="edit-btn" type="button" title="Rename" aria-label="Rename">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </button>
            <span class="pill size-pill"></span>
            <span class="pill source-pill"></span>
            <span class="spacer"></span>
            <button class="dl" type="button">
              <svg class="dl-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              <span class="dl-label">Download</span>
            </button>
            <button class="more" type="button" title="Copy URL" aria-label="More actions">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
          </div>
          <div class="progress" hidden>
            <div class="progress-track"><div class="progress-fill"></div></div>
            <span class="progress-text"></span>
          </div>
        </div>
      </li>
    </template>
    <script src="popup.js"></script>
  </body>
</html>
