<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VidLoad</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>VidLoad</h1>
      <p id="status">Scanning…</p>
    </header>
    <ul id="list"></ul>
    <footer>
      <button id="toggle-hidden" type="button" hidden></button>
    </footer>
    <template id="row-template">
      <li class="row">
        <div class="thumb">
          <img class="thumb-img" alt="" />
          <svg class="thumb-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          <span class="thumb-quality"></span>
          <span class="thumb-kind"></span>
        </div>
        <div class="meta">
          <div class="title"></div>
          <div class="sub"></div>
          <div class="url"></div>
        </div>
        <button class="dl" type="button">Download</button>
      </li>
    </template>
    <script src="popup.js"></script>
  </body>
</html>
